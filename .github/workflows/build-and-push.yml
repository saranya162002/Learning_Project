###############################################################################
# GitHub Actions - Build & Push Docker Images to GHCR
#
# Image dependency chain:
#   ubuntu:22.04
#       └── ecommerce-platform-base:latest
#               ├── ecommerce-platform-spark:latest
#               ├── ecommerce-platform-airflow:latest
#               └── ecommerce-platform-dbt:latest
#
# Strategy:
#   1. Build & push base image first
#   2. Build & push spark, airflow, dbt in parallel (they all depend on base)
###############################################################################

name: Build & Push Docker Images

on:
  push:
    branches: [main]
    paths:
      - 'docker/**'
      - '.github/workflows/build-and-push.yml'
  pull_request:
    branches: [main]
    paths:
      - 'docker/**'
      - '.github/workflows/build-and-push.yml'
  workflow_dispatch:           # Allow manual trigger

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/ecommerce-platform

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # Job 1: Build & push the base image (all others depend on it)
  # ──────────────────────────────────────────────────────────────────────────
  build-base:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      base_tag: ${{ steps.meta.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-base
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build & push base image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/base/DockerFile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=base
          cache-to: type=gha,mode=max,scope=base
          platforms: linux/amd64

  # ──────────────────────────────────────────────────────────────────────────
  # Job 2: Build & push child images in parallel (spark, airflow, dbt)
  # ──────────────────────────────────────────────────────────────────────────
  build-children:
    needs: build-base
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - image: spark
            dockerfile: docker/spark/DockerFile
          - image: airflow
            dockerfile: docker/airflow/DockerFile
          - image: dbt
            dockerfile: docker/dbt/DockerFile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.image }}
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build & push ${{ matrix.image }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          platforms: linux/amd64
          build-args: |
            BASE_IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-base:latest

