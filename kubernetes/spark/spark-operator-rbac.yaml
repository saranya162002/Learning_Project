###############################################################################
# Spark on Kubernetes — RBAC & Service Accounts
#
# Provides:
#   1. ServiceAccount `spark` — used by Spark Driver pods to request Executor pods
#   2. ServiceAccount `spark-operator` — used by Spark Operator to reconcile SparkApplication CRDs
#   3. Roles & RoleBindings — permissions to spawn, list, watch pods, services, configmaps
###############################################################################

apiVersion: v1
kind: ServiceAccount
metadata:
  name: spark
  namespace: ecommerce-platform
  labels:
    app.kubernetes.io/name: spark
    app.kubernetes.io/component: rbac
    app.kubernetes.io/part-of: ecommerce-data-platform

---

apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: spark-role
  namespace: ecommerce-platform
  labels:
    app.kubernetes.io/name: spark
    app.kubernetes.io/component: rbac
    app.kubernetes.io/part-of: ecommerce-data-platform
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "configmaps", "persistentvolumeclaims"]
    verbs: ["*"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch", "get", "list", "watch"]

---

apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: spark-role-binding
  namespace: ecommerce-platform
  labels:
    app.kubernetes.io/name: spark
    app.kubernetes.io/component: rbac
    app.kubernetes.io/part-of: ecommerce-data-platform
subjects:
  - kind: ServiceAccount
    name: spark
    namespace: ecommerce-platform
roleRef:
  kind: Role
  name: spark-role
  apiGroup: rbac.authorization.k8s.io

---

apiVersion: v1
kind: ServiceAccount
metadata:
  name: spark-operator
  namespace: ecommerce-platform
  labels:
    app.kubernetes.io/name: spark-operator
    app.kubernetes.io/component: operator
    app.kubernetes.io/part-of: ecommerce-data-platform

---

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: spark-operator-cluster-role
  labels:
    app.kubernetes.io/name: spark-operator
    app.kubernetes.io/component: operator
    app.kubernetes.io/part-of: ecommerce-data-platform
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "configmaps", "secrets", "persistentvolumeclaims", "events"]
    verbs: ["*"]
  - apiGroups: ["sparkoperator.k8s.io"]
    resources: ["sparkapplications", "scheduledsparkapplications", "sparkapplications/status", "scheduledsparkapplications/status"]
    verbs: ["*"]
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list", "watch"]

---

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: spark-operator-cluster-role-binding
  labels:
    app.kubernetes.io/name: spark-operator
    app.kubernetes.io/component: operator
    app.kubernetes.io/part-of: ecommerce-data-platform
subjects:
  - kind: ServiceAccount
    name: spark-operator
    namespace: ecommerce-platform
roleRef:
  kind: ClusterRole
  name: spark-operator-cluster-role
  apiGroup: rbac.authorization.k8s.io

