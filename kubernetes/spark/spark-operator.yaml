###############################################################################
# Spark Operator — Custom Resource Definitions & Deployment
#
# Provides:
#   1. SparkApplication CRD definition (sparkoperator.k8s.io/v1beta2)
#   2. Spark Operator Deployment running in ecommerce-platform namespace
###############################################################################

apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: sparkapplications.sparkoperator.k8s.io
  labels:
    app.kubernetes.io/name: spark-operator
    app.kubernetes.io/part-of: ecommerce-data-platform
spec:
  group: sparkoperator.k8s.io
  names:
    kind: SparkApplication
    listKind: SparkApplicationList
    plural: sparkapplications
    singular: sparkapplication
    shortNames:
      - sparkapp
  scope: Namespaced
  versions:
    - name: v1beta2
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-preserve-unknown-fields: true

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: spark-operator
  namespace: ecommerce-platform
  labels:
    app.kubernetes.io/name: spark-operator
    app.kubernetes.io/component: operator
    app.kubernetes.io/part-of: ecommerce-data-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: spark-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: spark-operator
        app.kubernetes.io/component: operator
        app.kubernetes.io/part-of: ecommerce-data-platform
    spec:
      serviceAccountName: spark-operator
      containers:
        - name: spark-operator
          image: ghcr.io/googlecloudplatform/spark-on-k8s-operator:v1beta2-1.3.8-3.1.1
          imagePullPolicy: IfNotPresent
          args:
            - -v=2
            - -namespace=ecommerce-platform
            - -enable-ui-service=true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi

