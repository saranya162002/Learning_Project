###############################################################################
# SparkApplication — Gold Layer Aggregation
#
# Transforms Silver domain entities into Star Schema Dimensions & Facts
# (dim_product, dim_brand, dim_seller, dim_warehouse, fact_inventory, etc.)
# and feeds OLAP search/serving engines (ClickHouse, OpenSearch, Qdrant).
###############################################################################

apiVersion: sparkoperator.k8s.io/v1beta2
kind: SparkApplication
metadata:
  name: spark-gold-aggregation
  namespace: ecommerce-platform
  labels:
    app.kubernetes.io/name: spark
    app.kubernetes.io/component: gold-aggregation
    app.kubernetes.io/part-of: ecommerce-data-platform
spec:
  type: Python
  pythonVersion: "3"
  mode: cluster
  image: ghcr.io/saranyarajagopal/ecommerce-platform-spark:latest
  imagePullPolicy: IfNotPresent
  mainApplicationFile: local:///workspace/pipelines/metadata/gold/gold_aggregation_job.py
  sparkVersion: "3.5.1"
  restartPolicy:
    type: OnFailure
    onFailureRetries: 3
    onFailureRetryInterval: 10
    onSubmissionFailureRetries: 5
    onSubmissionFailureRetryInterval: 20

  driver:
    cores: 1
    coreLimit: "1200m"
    memory: "512m"
    labels:
      version: 3.5.1
      role: driver
    serviceAccount: spark
    envFrom:
      - configMapRef:
          name: spark-config

  executor:
    cores: 1
    instances: 2
    memory: "512m"
    labels:
      version: 3.5.1
      role: executor
    envFrom:
      - configMapRef:
          name: spark-config

