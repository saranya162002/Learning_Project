###############################################################################
# Airflow Persistent Volume Claims
#
# Provides persistent storage for:
#   1. Airflow DAGs  (shared volume across webserver, scheduler, jobs)
#   2. Airflow Logs  (shared execution & UI task logs)
###############################################################################

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: airflow-dags-pvc
  namespace: ecommerce-platform
  labels:
    app.kubernetes.io/name: airflow
    app.kubernetes.io/component: storage
    app.kubernetes.io/part-of: ecommerce-data-platform
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 5Gi

---

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: airflow-logs-pvc
  namespace: ecommerce-platform
  labels:
    app.kubernetes.io/name: airflow
    app.kubernetes.io/component: storage
    app.kubernetes.io/part-of: ecommerce-data-platform
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 5Gi

