###############################################################################
# ZooKeeper Setup for Kafka
#
# Contains:
#   1. ZooKeeper Headless & Client Service
#   2. ZooKeeper StatefulSet (Single instance with persistent storage)
#   3. PersistentVolumeClaim (5Gi)
###############################################################################

apiVersion: v1
kind: Service
metadata:
  name: zookeeper
  namespace: ecommerce-platform
  labels:
    app.kubernetes.io/name: zookeeper
    app.kubernetes.io/component: zookeeper
    app.kubernetes.io/part-of: ecommerce-data-platform
spec:
  type: ClusterIP
  ports:
    - name: client
      port: 2181
      targetPort: 2181
      protocol: TCP
    - name: follower
      port: 2888
      targetPort: 2888
      protocol: TCP
    - name: leader-election
      port: 3888
      targetPort: 3888
      protocol: TCP
  selector:
    app.kubernetes.io/name: zookeeper

---

apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: zookeeper
  namespace: ecommerce-platform
  labels:
    app.kubernetes.io/name: zookeeper
    app.kubernetes.io/component: zookeeper
    app.kubernetes.io/part-of: ecommerce-data-platform
spec:
  serviceName: zookeeper
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: zookeeper
  template:
    metadata:
      labels:
        app.kubernetes.io/name: zookeeper
        app.kubernetes.io/component: zookeeper
        app.kubernetes.io/part-of: ecommerce-data-platform
    spec:
      containers:
        - name: zookeeper
          image: zookeeper:3.8
          ports:
            - containerPort: 2181
              name: client
            - containerPort: 2888
              name: follower
            - containerPort: 3888
              name: leader-election
          env:
            - name: ZOO_MY_ID
              value: "1"
            - name: ZOO_SERVERS
              value: "server.1=zookeeper-0.zookeeper.ecommerce-platform.svc.cluster.local:2888:3888;2181"
            - name: ZOO_4LW_COMMAND_WHITELIST
              value: "srvr, mntr, ruok"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: zookeeper-data
              mountPath: /data
            - name: zookeeper-datalog
              mountPath: /datalog
          # readinessProbe:
          #   exec:
          #     command:
          #       - /bin/bash
          #       - -c
          #       - "echo ruok | nc localhost 2181 | grep imok"
          #   initialDelaySeconds: 10
          #   periodSeconds: 10
          # livenessProbe:
          #   exec:
          #     command:
          #       - /bin/bash
          #       - -c
          #       - "echo ruok | nc localhost 2181 | grep imok"
          #   initialDelaySeconds: 20
          #   periodSeconds: 15

  volumeClaimTemplates:
    - metadata:
        name: zookeeper-data
        labels:
          app.kubernetes.io/name: zookeeper
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 5Gi
    - metadata:
        name: zookeeper-datalog
        labels:
          app.kubernetes.io/name: zookeeper
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 5Gi

