###############################################################################
# Kafka StatefulSet — 2-Broker Cluster with ZooKeeper
#
# StatefulSet Specs:
#   - Replicas: 2 (kafka-0, kafka-1)
#   - Storage: 5Gi PVC per broker
#   - Coordination: ZooKeeper (zookeeper.ecommerce-platform.svc.cluster.local:2181)
#
# Image: apache/kafka:3.7.0 (official Apache Kafka image)
###############################################################################
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  namespace: ecommerce-platform
  labels:
    app.kubernetes.io/name: kafka
    app.kubernetes.io/component: broker
    app.kubernetes.io/part-of: ecommerce-data-platform
spec:
  serviceName: kafka-headless
  replicas: 2
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app.kubernetes.io/name: kafka
      app.kubernetes.io/component: broker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kafka
        app.kubernetes.io/component: broker
        app.kubernetes.io/part-of: ecommerce-data-platform
    spec:
      terminationGracePeriodSeconds: 30

      # ── Init Container: generate per-broker server.properties ──
      initContainers:
        - name: kafka-init
          image: apache/kafka:3.7.0
          command: ["/bin/bash", "/etc/kafka/config/init-kafka.sh"]
          volumeMounts:
            - name: kafka-data
              mountPath: /var/lib/kafka/data
            - name: kafka-config-volume
              mountPath: /etc/kafka/config
            - name: kafka-tmp-config
              mountPath: /tmp

      # ── Main Kafka Broker Container ──
      containers:
        - name: kafka
          image: apache/kafka:3.7.0
          command: ["kafka-server-start.sh", "/tmp/server.properties"]
          ports:
            - name: client
              containerPort: 9092
              protocol: TCP
          env:
            - name: KAFKA_HEAP_OPTS
              value: "-Xmx512m -Xms512m"
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: kafka-data
              mountPath: /var/lib/kafka/data
            - name: kafka-tmp-config
              mountPath: /tmp
          readinessProbe:
            tcpSocket:
              port: 9092
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 9092
            initialDelaySeconds: 40
            periodSeconds: 20
            timeoutSeconds: 5

      volumes:
        - name: kafka-config-volume
          configMap:
            name: kafka-config
            defaultMode: 0755
        - name: kafka-tmp-config
          emptyDir: {}

  # ── Per-Broker Persistent Storage (5Gi per broker) ──
  volumeClaimTemplates:
    - metadata:
        name: kafka-data
        labels:
          app.kubernetes.io/name: kafka
          app.kubernetes.io/component: broker
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 5Gi
