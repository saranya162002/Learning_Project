###############################################################################
# Grafana Dashboards Provider ConfigMap
#
# Automatically loads JSON dashboards from `/var/lib/grafana/dashboards/`
###############################################################################

apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards-provider
  namespace: monitoring
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/component: visualization
    app.kubernetes.io/part-of: ecommerce-data-platform
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: 'Ecommerce Platform Dashboards'
        orgId: 1
        folder: 'Ecommerce Data Platform'
        type: file
        disableDeletion: false
        updateIntervalSeconds: 30
        allowUiUpdates: true
        options:
          path: /var/lib/grafana/dashboards

